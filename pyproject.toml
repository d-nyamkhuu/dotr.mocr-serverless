[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dotr-mocr-serverless"
version = "0.1.0"
description = "Scale-to-zero dots.mocr layout parsing API on Modal, with a Word exporter"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "modal==1.5.4",
    "pillow==12.3.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
word = [
    "lxml==6.1.3",
    "numpy==2.4.6",
    "opencv-python-headless==4.14.0.94",
    "pypandoc-binary==1.17",
    "pypdfium2==5.13.0",
    "python-docx==1.2.0",
]

[tool.setuptools]
py-modules = ["layout_api", "modal_app"]
packages = ["word_export"]
